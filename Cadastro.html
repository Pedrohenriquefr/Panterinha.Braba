<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#111;
      color:white;
    }

    header{
      width:100%;
      background:#000;
      padding:20px;
      text-align:center;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin:0 20px;
      font-size:20px;
      font-weight:bold;
    }

    section{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .background{
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .overlay{
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
    }

    .box{
      position:relative;
      z-index:2;
      background:rgba(0,0,0,0.85);
      padding:40px;
      width:450px;
    }

    h2{
      text-align:center;
      font-size:45px;
      color:#ffd400;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      margin-bottom:20px;
      border:none;
      font-size:18px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      font-size:20px;
      font-weight:bold;
      cursor:pointer;
      background:#ffd400;
    }

    p{
      text-align:center;
      margin-top:20px;
    }

    p a{
      color:#ffd400;
      text-decoration:none;
      font-weight:bold;
    }

  </style>

</head>
<body>

<header>
  <nav>
    <a >Home</a>
    <a >Sobre</a>
    <a >Login</a>
    <a >Cadastro</a>
  </nav>
</header>

<section>

  <img class="background" src="img/o cafetão.webp">

  <div class="overlay"></div>

  <div class="box">

    <h2>CADASTRO</h2>

    <input type="text" placeholder="Nome">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">

    <button>Cadastrar</button>

    

  </div>

</section>

</body>
</html>
